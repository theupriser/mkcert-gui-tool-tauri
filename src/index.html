<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mkcert GUI Tool</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: #f5f5f7; }
    .status-banner { padding: 12px 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; font-size: 14px; border-bottom: 1px solid transparent; }
    .status-success { background: #d4edda; color: #155724; border-color: #c3e6cb; }
    .status-danger { background: #f8d7da; color: #721c24; border-color: #f5c6cb; }
    .app-content { padding: 20px; }
    h2 { color: #333; margin-top: 0; }
    label { font-weight: bold; display: block; margin-top: 15px; margin-bottom: 8px; }
    textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; resize: vertical; box-sizing: border-box; }
    .dir-container { display: flex; gap: 10px; }
    input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; background: #e9e9eb; }
    .checkbox-container { display: flex; align-items: center; gap: 10px; margin-top: 18px; background: #fff; padding: 12px; border-radius: 6px; border: 1px solid #ccc; }
    .checkbox-container input { width: 18px; height: 18px; cursor: pointer; }
    .checkbox-container label { margin: 0; font-weight: normal; cursor: pointer; }
    .btn-secondary { background: #e5e5ea; color: #333; border: 1px solid #ccc; padding: 10px 15px; font-size: 14px; border-radius: 6px; cursor: pointer; }
    .btn-secondary:hover { background: #d1d1d6; }
    .btn-danger { background: #dc3545; color: white; border: none; padding: 6px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; }
    .btn-danger:hover { background: #bd2130; }
    .btn-primary { background: #007aff; color: white; border: none; padding: 12px 20px; font-size: 14px; border-radius: 6px; cursor: pointer; margin-top: 20px; width: 100%; font-weight: bold; }
    .btn-primary:hover { background: #0063cc; }
    pre { background: #222; color: #00ff00; padding: 15px; border-radius: 6px; overflow-x: auto; max-height: 140px; font-size: 12px; margin-top: 15px; }
  </style>
</head>
<body>

  <div id="status-banner" class="status-banner status-danger" style="display: none;">
    <span id="status-text">Loading status...</span>
    <button id="btn-install-ca" class="btn-danger" style="display: none;">Install Now</button>
  </div>

  <div class="app-content">
    <h2>Local Certificate Generator</h2>
    
    <label for="domains">1. Domains (separated by commas):</label>
    <textarea id="domains" placeholder="domain1.test, domain2.test..."></textarea>

    <label for="directory">2. Certificates Destination Directory:</label>
    <div class="dir-container">
      <input type="text" id="directory" placeholder="Default user directory..." readonly>
      <button id="btn-browse" class="btn-secondary">Browse...</button>
    </div>

    <div class="checkbox-container">
      <input type="checkbox" id="auto-schedule">
      <label for="auto-schedule"><strong>Automatically renew daily</strong> (Add to Crontab / Windows Task Scheduler)</label>
    </div>

    <button id="btn-generate" class="btn-primary">Generate Certificates</button>

    <h3>Status Log:</h3>
    <pre id="log">Verifying environment status...</pre>
  </div>

  <script type="module">
    const { invoke } = window.__TAURI__.core;

    const statusBanner = document.getElementById('status-banner');
    const statusText = document.getElementById('status-text');
    const btnInstallCa = document.getElementById('btn-install-ca');
    const btnBrowse = document.getElementById('btn-browse');
    const btnGenerate = document.getElementById('btn-generate');
    const domainsInput = document.getElementById('domains');
    const directoryInput = document.getElementById('directory');
    const autoScheduleCheckbox = document.getElementById('auto-schedule');
    const logOutput = document.getElementById('log');

    let selectedDirectory = '';

    async function initApp() {
      try {
        const savedSettings = await invoke('load_settings');
        if (savedSettings) {
          if (savedSettings.domains) domainsInput.value = savedSettings.domains;
          if (savedSettings.directory) {
            selectedDirectory = savedSettings.directory;
            directoryInput.value = selectedDirectory;
          }
          if (savedSettings.auto_schedule !== undefined) {
            autoScheduleCheckbox.checked = savedSettings.auto_schedule;
          }
        }
        checkCAStatus();
      } catch (e) {
        logOutput.innerText = `❌ Error initializing app: ${e}`;
      }
    }

    async function checkCAStatus() {
      try {
        const status = await invoke('check_root_ca');
        statusBanner.style.display = 'flex';
        
        if (status.installed) {
          statusBanner.className = 'status-banner status-success';
          statusText.innerText = '✅ mkcert & Root CA are successfully installed and trusted.';
          btnInstallCa.style.display = 'none';
          btnGenerate.disabled = false;
          btnGenerate.style.opacity = '1';
          logOutput.innerText = 'Ready for use.';
        } else if (status.missing_binary) {
          statusBanner.className = 'status-banner status-danger';
          statusText.innerText = status.error;
          btnInstallCa.style.display = 'none';
          btnGenerate.disabled = true;
          btnGenerate.style.opacity = '0.5';
          logOutput.innerText = '⚠️ Action required: Install mkcert on your local machine.';
        } else {
          statusBanner.className = 'status-banner status-danger';
          statusText.innerText = '❌ Local Root CA is NOT installed or trusted!';
          btnInstallCa.style.display = 'block';
          btnGenerate.disabled = false;
          btnGenerate.style.opacity = '1';
          logOutput.innerText = '⚠️ Hint: Click "Install Now" to trust certificates locally.';
        }
      } catch (e) {
        logOutput.innerText = `❌ Error checking CA status: ${e}`;
      }
    }

    initApp();

    btnInstallCa.addEventListener('click', async () => {
      logOutput.innerText = 'Installing Local Root CA...';
      try {
        const result = await invoke('install_root_ca');
        if (result.success) {
          logOutput.innerText = `✅ Root CA successfully trusted!\n\n${result.message}`;
          checkCAStatus();
        } else { logOutput.innerText = `❌ Installation failed:\n\n${result.message}`; }
      } catch (e) { logOutput.innerText = `❌ Error: ${e}`; }
    });

    btnBrowse.addEventListener('click', async () => {
      try {
        const dir = await invoke('select_directory');
        if (dir) {
          selectedDirectory = dir; 
          directoryInput.value = selectedDirectory; 
        }
      } catch (e) { logOutput.innerText = `❌ Error browsing folder: ${e}`; }
    });

    btnGenerate.addEventListener('click', async () => {
      logOutput.innerText = 'Generating local SSL certificates...';
      try {
        const result = await invoke('generate_certs', { 
          domainsString: domainsInput.value, 
          targetDir: selectedDirectory 
        });
        
        if (result.success) {
          logOutput.innerText = `✅ Success!\n\n${result.message}`;
          
          await invoke('save_settings', {
            settings: {
              domains: domainsInput.value,
              directory: selectedDirectory,
              auto_schedule: autoScheduleCheckbox.checked
            }
          });
          
          if (autoScheduleCheckbox.checked) {
            logOutput.innerText += `\n\n⏰ Automated execution scheduled daily at 00:00!`;
          } else {
            logOutput.innerText += `\n\nManual execution mode enabled.`;
          }
        } else { logOutput.innerText = `❌ Error occurred:\n\n${result.message}`; }
      } catch (e) { logOutput.innerText = `❌ Execution error: ${e}`; }
    });
  </script>
</body>
</html>
