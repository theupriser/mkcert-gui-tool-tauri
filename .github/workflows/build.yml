name: Release Tauri App

on:
  push:
    branches: [ master, main ] # Start automatisch bij elke push naar master of main
  workflow_dispatch: # Hiermee kun je de build handmatig starten via de GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    permissions:
      contents: write # Cruciaal om de installers naar de Release-pagina te kunnen uploaden

    strategy:
      fail-fast: false
      matrix:
        # Bouwt parallel op Linux, Windows en macOS
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # Installeer de stabiele Rust toolchain
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Rust cache om de bouwtijd bij volgende pushes drastisch te verkorten
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Systeembestanden die ALLEEN op Linux nodig zijn (Tauri v2 + RPM support)
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoup-3.0-dev libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev rpm

      - name: Install node dependencies
        run: npm install

      # De officiële Tauri actie die de builds uitvoert en uploadt naar GitHub Releases
      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Genereert een unieke release tag op basis van de commit-hash (voorkomt foutloops)
          tagName: dev-${{ github.sha }}
          releaseName: 'Latest Continuous Build'
          releaseBody: 'This release contains the standalone installation binaries from the latest commit.'
          releaseDraft: false
          prerelease: true # Gemarkeerd als pre-release omdat het een automatische tussentijdse build is

          # Voert 'npm run tauri build' uit via het script in je package.json
          tauriScript: npm run tauri
