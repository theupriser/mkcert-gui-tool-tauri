name: Release Tauri App

on:
  push:
    branches: [ master, main ] # Triggered automatically on every push to master or main
  workflow_dispatch: # Allows manual execution from the GitHub UI

# Enforce Node.js 24 environment compatibility across the platform runners
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    permissions:
      contents: write # Required to publish assets to the Release page
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # Modern Node 24 environment
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux-specific build headers
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoup-3.0-dev libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev rpm

      # FIX: Changed from 'npm ci' to 'npm install' to dynamically resolve lockfile dependency mismatches
      - name: Install node dependencies
        run: npm install

      # The Tauri Action configured to explicitly compile and attach only the clean target binaries
      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: latest
          releaseName: 'Latest Continuous Build'
          releaseBody: 'This release always contains the separate download binaries from the latest commit on your master/main branch.'
          overwrite: true
          releaseDraft: false
          prerelease: false
          includeRelease: true
          includeDebug: false
          includeAppImage: false # Strips AppImage maps
          artifacts: "deb,rpm,nsis,dmg" # Force uploads ONLY for .deb, .rpm, .exe and .dmg
