name: Release Tauri App

on:
  push:
    branches: [ master, main ] # Automatisch bij elke push naar master of main
  workflow_dispatch: # Handmatig starten vanuit de GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    permissions:
      contents: write # Vereist om bestanden aan de Release toe te voegen

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      # Installeer Rust
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Rust cache om bouwtijden drastisch te verkorten
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux build dependencies voor Tauri v2 + RPM ondersteuning
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoup-3.0-dev libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev rpm

      - name: Install node dependencies
        run: npm install

      # Bouw en release de applicatie via de officiële Tauri actie
      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Genereert een unieke tag per commit om release-overschrijf-fouten te voorkomen
          tagName: dev-${{ github.sha }}
          releaseName: 'Latest Continuous Build'
          releaseBody: 'This release contains the separate download binaries from the latest commit on your main/master branch.'
          releaseDraft: false
          prerelease: true

          # Forceert de runner om npx tauri build te gebruiken in plaats van npm run tauri build
          tauriScript: npx tauri
