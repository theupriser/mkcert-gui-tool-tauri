name: Release Tauri App

on:
  push:
    branches: [ master, main ] # Triggered automatically on every push to master or main
  workflow_dispatch: # Allows manual execution from the GitHub UI

# Enforce Node.js 24 environment compatibility across the platform runners
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    permissions:
      contents: write # Required to publish assets to the Release page
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Linux-specific build headers
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsoup-3.0-dev libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev rpm

      - name: Install node dependencies
        run: npm install

      # The Tauri Action configured properly for Tauri v2 and explicit asset filtering
      - name: Build and Release Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: latest
          releaseName: 'Latest Continuous Build'
          releaseBody: 'This release always contains the separate download binaries from the latest commit on your master/main branch.'
          releaseDraft: false
          prerelease: false
          includeRelease: true
          includeDebug: false
          # FIX: Vertelt Tauri dat hij 'npm run build' moet gebruiken in plaats van het missende tauri-script
          tauriScript: npm run build --
          # FIX: Filtert via een regex patroon direct alleen de gewenste binaries (.deb, .rpm, .exe, .dmg) uit de upload
          assetNamePattern: '^[^.]+\.(deb|rpm|exe|dmg|msi)$'
